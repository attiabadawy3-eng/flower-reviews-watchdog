name: Capture Flower Review Response

on:
  push:
    paths:
      - ".github/workflows/capture-review-response.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=flower-reviews-watchdog")"
          token="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["value"])' "$oidc_json")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Fetch raw fallback response
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://flower-google-reviews-auto-reply.onrender.com/fallback/reviews/oidc")"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(json.dumps(d, ensure_ascii=False, indent=2, sort_keys=True))' "$response"
