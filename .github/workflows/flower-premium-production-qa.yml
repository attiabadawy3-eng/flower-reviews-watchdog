name: FLOWER Premium V17.3 Production Acceptance

on:
  push:
    paths:
      - ".github/workflows/flower-premium-production-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOWER_PREMIUM_QA_BASE: https://flower-serviced-apartments-sa.onrender.com
      FLOWER_PREMIUM_QA_OUTPUT: premium-production-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify actual FLOWER production premium and bookings
        run: python qa/flower_premium_qa.py
      - name: Preserve release screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-premium-production-evidence
          path: premium-production-qa/
          retention-days: 14
