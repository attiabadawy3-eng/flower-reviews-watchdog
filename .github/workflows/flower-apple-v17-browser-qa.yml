name: FLOWER Apple V17 Browser QA

on:
  push:
    paths:
      - "qa/flower_apple_v17_qa.py"
      - ".github/workflows/flower-apple-v17-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Audit Apple V17 staging in Chromium and WebKit
        run: python qa/flower_apple_v17_qa.py
      - name: Archive mobile screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-apple-v17-qa-screenshots
          path: apple-qa/
          retention-days: 14
