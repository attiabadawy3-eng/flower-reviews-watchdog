name: Build FLOWER Interactive V17.4 Staging
on:
  push:
    paths:
      - "site-build/**"
      - ".github/workflows/build-flower-interactive.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flower-interactive-staging
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLOWER_BUILD_VARIANT: flower-interactive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Build FLOWER Interactive
        run: python site-build/build_flower_site.py
      - name: Validate ZIP and all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          unzip -t deploy-assets/flower-interactive-v17-4-staging.zip > /dev/null
          python - <<'PY'
          import json,pathlib,zipfile
          m=json.loads(pathlib.Path('deploy-assets/flower-interactive-v17-4-manifest.json').read_text())
          assert m['variant']=='flower-interactive-v17.4-staging'
          assert all(m['tests'].values()), m['tests']
          with zipfile.ZipFile('deploy-assets/flower-interactive-v17-4-staging.zip') as z:
              need={'al-majmaah-harmah/index.html','en/al-majmaah-harmah/index.html',
                'assets/css/flower-interactive-v17-4.css','assets/js/flower-interactive-v17-4.js',
                'assets/js/google-reviews-live.js','robots.txt','sitemap.xml'}
              assert need <= set(z.namelist())
          print('FLOWER INTERACTIVE V17.4 PASS')
          PY
      - name: Save isolated staging artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name flower-interactive-builder
          git config user.email actions@users.noreply.github.com
          git add deploy-assets/flower-interactive-v17-4-staging.zip deploy-assets/flower-interactive-v17-4-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: FLOWER Interactive V17.4 staging'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --mixed origin/main
            git add deploy-assets/flower-interactive-v17-4-staging.zip deploy-assets/flower-interactive-v17-4-manifest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'build: FLOWER Interactive V17.4 staging'
            sleep 2
          done
          exit 1
