name: FLOWER V17 Production Acceptance

on:
  push:
    paths:
      - ".github/workflows/flower-v17-production-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FLOWER_QA_BASE_URL: https://flower-serviced-apartments-sa.onrender.com
      FLOWER_QA_OUTPUT: production-apple-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify actual FLOWER production site at 11 route/viewports per engine
        run: python qa/flower_apple_v17_qa.py
      - name: Save production screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-v17-production-qa
          path: production-apple-qa/
          retention-days: 14
