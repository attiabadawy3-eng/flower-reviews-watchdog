name: Build FLOWER Apple Motion Staging

on:
  push:
    paths:
      - ".github/workflows/build-flower-apple-motion.yml"
      - "site-build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flower-apple-motion-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLOWER_BUILD_VARIANT: apple-motion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Build isolated FLOWER Apple Motion staging ZIP
        run: python site-build/build_flower_site.py
      - name: Validate ZIP and original booking features
        shell: bash
        run: |
          set -euo pipefail
          unzip -t deploy-assets/flower-site-apple-motion-staging.zip >/dev/null
          python - <<'PY'
          import json,pathlib,zipfile
          m=json.loads(pathlib.Path("deploy-assets/flower-apple-motion-staging-manifest.json").read_text())
          assert m["variant"] == "apple-v17.1-motion-staging",m["variant"]
          assert all(m["tests"].values()),m["tests"]
          with zipfile.ZipFile("deploy-assets/flower-site-apple-motion-staging.zip") as z:
              names=set(z.namelist())
              assert {"assets/css/flower-apple-v17.css","assets/css/flower-apple-motion.css",
                      "assets/js/flower-apple-motion.js","assets/js/google-reviews-live.js",
                      "al-majmaah-harmah/index.html","index.html","robots.txt","sitemap.xml"} <= names
          print("APPLE MOTION STAGING ZIP PASS")
          PY
      - name: Save isolated animation candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flower-motion-builder"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-assets/flower-site-apple-motion-staging.zip deploy-assets/flower-apple-motion-staging-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: FLOWER Apple Motion staging candidate"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --mixed origin/main
            git add deploy-assets/flower-site-apple-motion-staging.zip deploy-assets/flower-apple-motion-staging-manifest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "build: FLOWER Apple Motion staging candidate"
            sleep 2
          done
          exit 1
