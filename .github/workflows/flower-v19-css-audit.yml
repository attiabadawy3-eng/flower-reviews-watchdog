name: FLOWER V19 CSS Safe Bundle Inspection
on:
  push:
    branches: [flower-signature-v19-staging]
    paths: [".github/workflows/flower-v19-css-audit.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: flower-signature-v19-staging}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Inspect real page stylesheet load order and imports
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          import zipfile,json,re
          with zipfile.ZipFile("deploy-assets/flower-signature-v19-staging.zip") as z:
              for path in ["index.html","dammam-al-anoud/index.html","al-majmaah-harmah/index.html"]:
                  s=BeautifulSoup(z.read(path),"html.parser")
                  a=[]
                  for l in s.select('link[rel="stylesheet"]'):
                      h=l.get("href") or ""
                      if not h.startswith("/assets/css/"):
                          a.append({"href":h,"external":True})
                          continue
                      data=z.read(h.lstrip("/")).decode("utf8",errors="replace")
                      a.append({"href":h,"size":len(data),"imports":re.findall(r"@import[^;]+;",data,re.I)[:2],"media":l.get("media")})
                  print("CSS_INSPECT",path,json.dumps(a))
          PY
