name: Flower V16 Mobile Desktop QA
on:
  push:
    paths:
      - "qa/check_visual_v16.py"
      - ".github/workflows/check-v16-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate exact mobile and desktop viewports
        run: python qa/check_visual_v16.py
      - name: Upload viewport screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-v16-390-1440-screenshots
          path: deploy-assets/v16-qa/
          if-no-files-found: warn
