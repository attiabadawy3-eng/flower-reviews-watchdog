name: FLOWER V6 Canary GET-Only Reconciliation 2026-11-10

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flower-v6-readback-reconciliation-20261110
  cancel-in-progress: false

jobs:
  reconcile-one:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify original single reply by Google GET and Neon CAS only
        shell: bash
        env:
          V6_CRON_SECRET: ${{ secrets.V6_CRON_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          review = ('accounts/118082925604360965903/locations/9619996328379786259/reviews/'
                    'AbFvOqnQBoGoBjX27Srkok8yLFLmQxNNIZcEoDA8evSCh6ly4YE8hDj-cqj_vGSERKVGia-vVql-6g')
          token = os.environ.get('V6_CRON_SECRET','')
          if not token:
              raise RuntimeError('GitHub secret V6_CRON_SECRET is missing')
          url = 'https://flower-reviews-v6-staging.onrender.com/internal/canary-readback-only'
          statuses = []
          for attempt in range(1, 9):
              payload = json.dumps({'review_name':review}).encode('utf-8')
              req = Request(url, data=payload, method='POST',
                            headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with urlopen(req, timeout=120) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
              except HTTPError as exc:
                  raise RuntimeError('GET-only verification endpoint failed HTTP %d' % exc.code) from None
              status = data.get('status')
              if data.get('google_writes') != 0 or data.get('google_write_attempted') is not False:
                  raise RuntimeError('Server did not prove zero Google writes')
              statuses.append(status)
              print('GET_ONLY_ATTEMPT %d: status=%s, google_write_attempted=false' %
                    (attempt, status), flush=True)
              if status == 'posted_readback_confirmed':
                  print('SUCCESS: Google GET matches the approved reply; Neon transitioned to posted',flush=True)
                  sys.exit(0)
              if status == 'not_pending_verification':
                  print('RECHECK: no longer pending; require independent Neon status check',flush=True)
                  sys.exit(0)
              if status not in ('awaiting_google_visibility','google_moderation_pending'):
                  raise RuntimeError('Review requires manual investigation, do not send another PUT: '+str(status))
              if attempt < 8:
                  time.sleep(15)
          raise RuntimeError('Reply still not independently confirmed. DO NOT RETRY PUT.')
          PY
