name: Build Flower Website Production Artifact

on:
  push:
    paths:
      - "site-build/**"
      - ".github/workflows/build-flower-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flower-website-artifact-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Mirror current production and apply verified patch
        run: python site-build/build_flower_site.py

      - name: Validate deployment archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t deploy-assets/flower-site-production.zip
          python - <<'PY'
          import json, pathlib, zipfile
          m=json.loads(pathlib.Path("deploy-assets/flower-site-manifest.json").read_text(encoding="utf-8"))
          assert all(m["tests"].values()), m["tests"]
          with zipfile.ZipFile("deploy-assets/flower-site-production.zip") as z:
              names=set(z.namelist())
              required={
                  "index.html",
                  "al-majmaah-harmah/index.html",
                  "assets/js/google-reviews-live.js",
                  "assets/css/site-v14-live.css",
                  "sitemap.xml",
                  "robots.txt",
              }
              missing=required-names
              assert not missing, missing
          print("FLOWER SITE ARTIFACT PASS", m["fileCount"], m["zipBytes"])
          PY

      - name: Publish deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flower-site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-assets/flower-site-production.zip deploy-assets/flower-site-manifest.json
          if git diff --cached --quiet; then
            echo "Artifact unchanged."
            exit 0
          fi
          git commit -m "build: Flower website production candidate"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --mixed origin/main
            git add deploy-assets/flower-site-production.zip deploy-assets/flower-site-manifest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "build: Flower website production candidate"
            sleep 2
          done
          exit 1
