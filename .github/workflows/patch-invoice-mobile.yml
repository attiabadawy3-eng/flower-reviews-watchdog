name: Patch Flower invoices mobile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-invoice-mobile.yml'
      - 'deploy-assets/flower-invoices-logo.webp'
      - 'deploy-assets/scanner/**'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build document-scanner bundle
        shell: bash
        run: |
          set -e
          rm -rf /tmp/flower-invoices
          mkdir -p /tmp/flower-invoices
          unzip -q deploy-assets/flower-invoices-render.zip -d /tmp/flower-invoices
          cp deploy-assets/scanner/scanner-addon.js /tmp/flower-invoices/scanner-addon.js
          curl -fsSL https://docs.opencv.org/4.8.0/opencv.js -o /tmp/flower-invoices/opencv.js
          node --check /tmp/flower-invoices/scanner-addon.js
          python deploy-assets/scanner/patch_invoice.py /tmp/flower-invoices/index.html deploy-assets/flower-invoices-logo.webp
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/flower-invoices/index.html').read_text(encoding='utf-8')
          assert '/MediaBox [0 0 595 "+pdfH+"]' in s, 'dynamic PDF MediaBox missing'
          assert '595 0 0 "+pdfH+" 0 0 cm' in s, 'dynamic PDF image transform missing'
          assert '595 0 0 842 0 0 cm' not in s, 'stale 842 PDF transform still present'
          print('PDF dynamic transform verified')
          PY
          test -s /tmp/flower-invoices/index.html
          test -s /tmp/flower-invoices/scanner-addon.js
          test -s /tmp/flower-invoices/opencv.js
          rm -f deploy-assets/flower-invoices-render.zip
          (cd /tmp/flower-invoices && zip -q -9 "$GITHUB_WORKSPACE/deploy-assets/flower-invoices-render.zip" index.html scanner-addon.js opencv.js)

      - name: Commit scanner bundle
        shell: bash
        run: |
          git config user.name "flower-bot"
          git config user.email "flower-bot@users.noreply.github.com"
          git add deploy-assets/flower-invoices-render.zip
          if git diff --cached --quiet; then
            echo "Bundle already current"
          else
            git commit -m "Add Flower document scanner"
            git push
          fi
