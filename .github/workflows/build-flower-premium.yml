name: Build FLOWER Premium V17.3 Staging

on:
  push:
    paths:
      - ".github/workflows/build-flower-premium.yml"
      - "site-build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flower-premium-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLOWER_BUILD_VARIANT: apple-premium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Rebuild existing site with isolated premium V17.3
        run: python site-build/build_flower_site.py
      - name: Validate premium bundle and essential services
        shell: bash
        run: |
          set -euo pipefail
          unzip -t deploy-assets/flower-site-apple-premium-staging.zip >/dev/null
          python - <<'PY'
          import json,zipfile,pathlib
          m=json.loads(pathlib.Path("deploy-assets/flower-apple-premium-staging-manifest.json").read_text())
          assert m["variant"]=="apple-v17.3-premium-staging",m["variant"]
          assert all(m["tests"].values()),m["tests"]
          with zipfile.ZipFile("deploy-assets/flower-site-apple-premium-staging.zip") as z:
              names=set(z.namelist())
              expected={"assets/css/flower-apple-premium-v17-3.css","assets/css/flower-apple-cinema.css",
                        "assets/js/flower-apple-cinema.js","assets/js/google-reviews-live.js",
                        "al-majmaah-harmah/index.html","en/al-majmaah-harmah/index.html",
                        "index.html","en/index.html","robots.txt","sitemap.xml"}
              assert expected<=names,expected-names
          print("FLOWER PREMIUM V17.3 ZIP PASS")
          PY
      - name: Commit isolated premium build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flower-premium-builder"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-assets/flower-site-apple-premium-staging.zip deploy-assets/flower-apple-premium-staging-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: FLOWER Premium V17.3 staging ZIP"
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --mixed origin/main
            git add deploy-assets/flower-site-apple-premium-staging.zip deploy-assets/flower-apple-premium-staging-manifest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "build: FLOWER Premium V17.3 staging ZIP"
            sleep 2
          done
          exit 1
