name: Flower Reviews Watchdog

on:
  schedule:
    - cron: "2/5 * * * *"
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: flower-reviews-watchdog
  cancel-in-progress: false

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=flower-reviews-watchdog")"
          token="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["value"])' "$oidc_json")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Scan recent Google reviews
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 180             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             "https://flower-google-reviews-auto-reply.onrender.com/fallback/reviews/oidc")"
          echo "$response"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True; print("posted=",d.get("posted",0),"held=",d.get("held",0),"errors=",d.get("errors",0))' "$response"

  keep-schedule-active:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monthly heartbeat commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/watchdog-heartbeat.txt
          git config user.name "flower-reviews-watchdog"
          git config user.email "actions@users.noreply.github.com"
          git add .github/watchdog-heartbeat.txt
          git commit -m "chore: keep review watchdog active"
          git push
