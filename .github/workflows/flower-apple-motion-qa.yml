name: FLOWER Apple Motion Browser QA

on:
  push:
    paths:
      - "qa/flower_apple_motion_qa.py"
      - ".github/workflows/flower-apple-motion-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Exercise FLOWER staging motion, swipe controls and accessibility
        run: python qa/flower_apple_motion_qa.py
      - name: Save screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-apple-motion-qa
          path: apple-motion-qa/
          retention-days: 14
