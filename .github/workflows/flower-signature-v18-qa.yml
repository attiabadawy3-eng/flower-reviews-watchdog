name: FLOWER Signature V18 Browser QA
on:
  push:
    paths:
      - "qa/flower_signature_v18_qa.py"
      - ".github/workflows/flower-signature-v18-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Check FLOWER Signature V18 on actual staging
        run: python qa/flower_signature_v18_qa.py
      - name: Save viewport screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-signature-v18-screenshots
          path: signature-v18-qa/
          retention-days: 14
