name: FLOWER Premium V17.3 Browser QA

on:
  push:
    paths:
      - "qa/flower_premium_qa.py"
      - ".github/workflows/flower-premium-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Audit premium hero, cinematic story, bookings and fallbacks
        run: python qa/flower_premium_qa.py
      - name: Preserve screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-premium-v17-3-screenshots
          path: premium-qa/
          retention-days: 14
