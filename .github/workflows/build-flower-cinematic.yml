name: Build FLOWER Cinematic V17.2 Staging

on:
  push:
    paths:
      - ".github/workflows/build-flower-cinematic.yml"
      - "site-build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flower-cinematic-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLOWER_BUILD_VARIANT: apple-cinematic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Build scenic FLOWER 4 cinematic from verified live images
        run: python site-build/build_flower_site.py
      - name: Validate isolated ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t deploy-assets/flower-site-apple-cinematic-staging.zip >/dev/null
          python - <<'PY'
          import json,pathlib,zipfile
          p=pathlib.Path("deploy-assets/flower-apple-cinematic-staging-manifest.json")
          m=json.loads(p.read_text())
          assert m["variant"]=="apple-v17.2-cinematic-staging",m["variant"]
          assert all(m["tests"].values()),m["tests"]
          with zipfile.ZipFile("deploy-assets/flower-site-apple-cinematic-staging.zip") as z:
              names=set(z.namelist())
              need={"assets/css/flower-apple-cinema.css","assets/js/flower-apple-cinema.js",
                    "assets/js/flower-apple-motion.js","assets/css/flower-apple-v17.css",
                    "al-majmaah-harmah/index.html","en/al-majmaah-harmah/index.html",
                    "index.html","en/index.html","robots.txt","sitemap.xml"}
              assert need<=names,need-names
          print("FLOWER CINEMATIC V17.2 ZIP PASS")
          PY
      - name: Commit isolated staging candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "flower-cinematic-builder"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-assets/flower-site-apple-cinematic-staging.zip deploy-assets/flower-apple-cinematic-staging-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: FLOWER V17.2 cinematic staging candidate"
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --mixed origin/main
            git add deploy-assets/flower-site-apple-cinematic-staging.zip deploy-assets/flower-apple-cinematic-staging-manifest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "build: FLOWER V17.2 cinematic staging candidate"
            sleep 2
          done
          exit 1
