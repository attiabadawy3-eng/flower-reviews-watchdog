name: FLOWER Cinematic V17.2 Browser QA

on:
  push:
    paths:
      - ".github/workflows/flower-cinematic-qa.yml"
      - "qa/flower_cinematic_qa.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browsers
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify cinematic transitions, mobile and accessibility
        run: python qa/flower_cinematic_qa.py
      - name: Preserve screenshots and QA measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flower-cinematic-v17-2-qa
          path: apple-cinematic-qa/
          retention-days: 14
